<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Operations Panel - Login</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #121318;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            width: 320px;
        }
        h2 { text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0a0a0c;
            border: 1px solid #222;
            color: #00ff66;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #00ff66; }
        button {
            width: 100%;
            padding: 10px;
            background: #00ff66;
            color: #0a0a0c;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover { background: #00cc52; }
        .error { color: #ff4d4d; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>SYSTEM ACCESS</h2>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
