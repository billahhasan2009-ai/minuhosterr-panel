<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Operations Panel - Dashboard</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
        }
        .card {
            background: #121318;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
            margin-top: 20px;
        }
        .btn-logout {
            background: #ff4d4d;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>BOT OPERATIONS DASHBOARD</h2>
        <a href="/logout" class="btn-logout">LOGOUT</a>
    </div>
    <div class="card">
        <h3>SYSTEM STATUS: ONLINE</h3>
        <p>Welcome, Admin! Your control panel is running successfully.</p>
    </div>
</body>
</html>
